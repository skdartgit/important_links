{% extends "base.html" %}
{% block title %}Admin Login | Important Links{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <section class="form-card auth-card">
        <div class="form-icon">♙</div>
        <span class="eyebrow">RESTRICTED ACCESS</span>
        <h1>Administrator Login</h1>
        <p class="form-intro">Sign in to manage your important websites.</p>

        <form method="POST" action="{{ url_for('admin_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Enter your username"
                       autocomplete="username" maxlength="80" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Login to Dashboard <span>→</span>
            </button>
        </form>

        <p class="secure-note">✦ Secure administrator access</p>
    </section>
</div>
{% endblock %}
