{% extends "base.html" %}
{% block title %}Admin Settings | Important Links{% endblock %}

{% block content %}
<div class="form-page">
    <section class="form-card">
        <span class="eyebrow">ACCOUNT SECURITY</span>
        <h1>Admin Settings</h1>
        <p class="form-intro">Change your administrator login credentials.</p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">New Username</label>
                <input type="text" id="username" name="username"
                       value="{{ admin.username }}" maxlength="80" required
                       autocomplete="username">
            </div>

            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password"
                       name="current_password" required
                       autocomplete="current-password">
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password"
                       name="new_password" minlength="5" required
                       autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password"
                       name="confirm_password" minlength="5" required
                       autocomplete="new-password">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Update Credentials ✓
                </button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline">
                    Back
                </a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
