{% extends "base.html" %}
{% block title %}{{ page_title }} | Important Links{% endblock %}

{% block content %}
<div class="form-page">
    <section class="form-card">
        <span class="eyebrow">WEBSITE COLLECTION</span>
        <h1>{{ page_title }}</h1>
        <p class="form-intro">Enter the three details of your website.</p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="website_name">Website Name</label>
                <input type="text" id="website_name" name="website_name"
                       placeholder="e.g. Google"
                       maxlength="150" required
                       value="{{ link.website_name if link else '' }}">
            </div>

            <div class="form-group">
                <label for="purpose">For What Purpose?</label>
                <textarea id="purpose" name="purpose" rows="4"
                          maxlength="500" required
                          placeholder="Describe why you use this website...">{{ link.purpose if link else '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="website_url">Website Link</label>
                <input type="url" id="website_url" name="website_url"
                       placeholder="https://example.com"
                       maxlength="2048" required
                       value="{{ link.website_url if link else '' }}">
                <small>Include https:// or http:// at the beginning.</small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Save Website <span>✓</span>
                </button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline">
                    Cancel
                </a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
